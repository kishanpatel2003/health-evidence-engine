[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "health-evidence-engine"
version = "0.1.0"
description = "A local-first, evidence-preserving patient data bank"
requires-python = ">=3.11"
dependencies = ["cryptography==46.0.7"]

[project.scripts]
health-bank = "health_bank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
